<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AutoSub</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="workspace" aria-label="字幕工作區">
        <div class="topbar">
          <div>
            <h1>AutoSub</h1>
            <p>本機影片預覽，OpenAI 產生繁中字幕，匯出 SRT。</p>
            <div id="keyStatus" class="key-status is-checking">正在檢查 OpenAI API key...</div>
          </div>
          <div class="actions">
            <label class="file-button">
              <input id="mediaInput" type="file" accept="video/*,audio/*" />
              選擇影片
            </label>
            <button id="importProjectButton" class="secondary-button" type="button" disabled>匯入專案</button>
            <input id="projectInput" type="file" accept=".json,application/json" hidden />
            <button id="importSubtitleButton" class="secondary-button" type="button" disabled>匯入字幕</button>
            <input id="subtitleInput" type="file" accept=".srt,.vtt,text/vtt,application/x-subrip,text/plain" hidden />
            <button id="exportProjectButton" class="secondary-button" type="button" disabled>匯出專案</button>
            <button id="demoButton" class="secondary-button" type="button" disabled>載入測試字幕</button>
            <button id="transcribeButton" type="button" disabled>產生字幕</button>
            <select id="exportFormat" class="format-select" aria-label="匯出格式" disabled>
              <option value="srt">SRT</option>
              <option value="vtt">VTT</option>
              <option value="txt">TXT</option>
            </select>
            <button id="exportButton" type="button" disabled>匯出字幕</button>
            <button id="shutdownButton" class="danger-button" type="button">結束服務</button>
          </div>
        </div>

        <div id="progressPanel" class="progress-panel" hidden>
          <div class="progress-copy">
            <strong id="progressLabel">準備中</strong>
            <span id="progressPercent">0%</span>
          </div>
          <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
            <div id="progressBar" class="progress-bar"></div>
          </div>
        </div>

        <div class="content-grid">
          <section class="preview-panel" aria-label="影片預覽">
            <div class="player-frame">
              <video id="mediaPlayer" controls playsinline></video>
              <div id="captionOverlay" class="caption-overlay" aria-live="polite"></div>
            </div>
            <div class="status-row">
              <span id="statusText">請先選擇影片或音訊檔。</span>
              <span class="status-meta">
                <span id="projectStatus">尚未建立專案</span>
                <span id="timeText">00:00.000</span>
              </span>
            </div>
          </section>

          <aside class="editor-panel" aria-label="字幕編輯器">
            <div class="panel-header">
              <div class="panel-title">
                <h2>字幕</h2>
                <span id="segmentCount">0 段</span>
              </div>
              <div class="panel-tools">
                <label class="follow-toggle">
                  <input id="followPlaybackInput" type="checkbox" checked />
                  <span>跟隨播放</span>
                </label>
                <button id="undoButton" class="mini-button" type="button" disabled>復原</button>
                <button id="redoButton" class="mini-button" type="button" disabled>重做</button>
                <button id="addSegmentButton" class="mini-button" type="button" disabled>新增字幕段</button>
              </div>
            </div>
            <div id="timingToolbar" class="timing-toolbar" aria-label="整體字幕時間微調">
              <span>整體時間</span>
              <button class="micro-button" type="button" data-shift-all="-0.5" disabled>-0.5s</button>
              <button class="micro-button" type="button" data-shift-all="-0.1" disabled>-0.1s</button>
              <button class="micro-button" type="button" data-shift-all="0.1" disabled>+0.1s</button>
              <button class="micro-button" type="button" data-shift-all="0.5" disabled>+0.5s</button>
            </div>
            <div class="search-toolbar" aria-label="字幕搜尋取代">
              <input id="subtitleSearchInput" type="search" placeholder="搜尋字幕" disabled />
              <input id="subtitleReplaceInput" type="text" placeholder="取代為" disabled />
              <button id="previousMatchButton" class="micro-button" type="button" disabled>上一筆</button>
              <button id="nextMatchButton" class="micro-button" type="button" disabled>下一筆</button>
              <button id="replaceMatchButton" class="micro-button" type="button" disabled>取代</button>
              <button id="replaceAllButton" class="micro-button" type="button" disabled>全部取代</button>
              <span id="searchSummary">0 筆</span>
            </div>
            <div id="qualityPanel" class="quality-panel" hidden>
              <div class="quality-summary">
                <strong>品質檢查</strong>
                <span id="qualitySummary">目前未發現明顯問題</span>
              </div>
              <ol id="qualityList" class="quality-list" aria-label="字幕品質問題"></ol>
            </div>
            <div id="emptyState" class="empty-state">
              選擇檔案後按「產生字幕」，這裡會出現可編輯的字幕段落。
            </div>
            <ol id="segmentsList" class="segments-list" aria-label="字幕段落"></ol>
          </aside>
        </div>
      </section>
    </main>

    <script src="/app.js" type="module"></script>
  </body>
</html>
